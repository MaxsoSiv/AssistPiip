<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#5eead4"/>
    </linearGradient>
    <radialGradient id="shine" cx="0.3" cy="0.25" r="0.6">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="0.6" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect x="16" y="16" width="224" height="224" rx="56" ry="56"
        fill="url(#grad)" filter="url(#shadow)"/>

  <rect x="16" y="16" width="224" height="224" rx="56" ry="56"
        fill="url(#shine)"/>

  <text x="128" y="128"
        text-anchor="middle"
        dominant-baseline="central"
        font-family="'Segoe UI', -apple-system, Arial, sans-serif"
        font-size="148"
        font-weight="800"
        fill="#051018"
        letter-spacing="-4">P</text>
</svg>
